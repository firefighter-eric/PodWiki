name: Windows font QA

on:
  push:
    branches: [codex/windows-font-fallback]

permissions:
  contents: read

jobs:
  screenshot:
    name: Render self-hosted serif font
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Install locked Playwright browser
        run: npx --no-install playwright install chromium
        working-directory: apps/web

      - name: Build web application
        run: npm run build
        working-directory: apps/web

      - name: Capture Windows rendering evidence
        run: >-
          npx --no-install playwright test
          e2e/windows-font-screenshot.spec.ts
          --project=chromium-desktop
        working-directory: apps/web

      - name: Upload rendering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: podwiki-windows-font-qa
          path: |
            apps/web/test-results/**/podwiki-font-windows.png
            apps/web/test-results/**/font-proof.json
          if-no-files-found: error
          retention-days: 1
