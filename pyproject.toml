[project]
name = "podwiki"
version = "0.1.0"
description = "Markdown-first podcast transcript and summary archive"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
media = [
  "yt-dlp[default]==2026.7.4",
]
asr = [
  "mlx-audio==0.3.1; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-whisper==0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch==2.11.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
asr-cuda = [
  "qwen-asr==0.0.6; sys_platform == 'win32' and platform_machine == 'AMD64' or sys_platform == 'win32' and platform_machine == 'x86_64'",
  "torch==2.11.0; sys_platform == 'win32' and platform_machine == 'AMD64' or sys_platform == 'win32' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pip-audit==2.9.0",
  "ruff==0.12.12",
]

[tool.uv]
package = false
required-version = "==0.9.16"
default-groups = []
conflicts = [
  [
    { extra = "asr" },
    { extra = "asr-cuda" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pypi", extra = "asr" },
  { index = "pytorch-cu128", extra = "asr-cuda" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
